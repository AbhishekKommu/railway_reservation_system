{% extends "base.html" %}
{% block title %}Login | RailEase{% endblock %}

{% block nav_links %}
  <a href="{{ url_for('register_page') }}" class="btn btn-ghost">Register</a>
{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="subtitle">Log in to search trains and manage your bookings.</p>

    <div id="alert-box" class="alert error"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" id="login-btn">Log In</button>
    </form>

    <div class="switch">Don't have an account? <a href="{{ url_for('register_page') }}">Register here</a></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
